###############################################
# MoveIt Servo Configuration
###############################################
use_gazebo: false
command_in_type: "speed_units"

scale:
  # The teleop node already limits speed. Keep Servo scale at 1.0 so launch
  # parameters map directly to robot velocity instead of being halved again.
  linear:  1.0
  rotational:  1.0
  joint: 1.0

# 100 Hz matches the teleop timer and keeps RViz joint-state playback smooth.
publish_period: 0.010
low_latency_mode: false
publish_joint_positions: true
publish_joint_velocities: true
publish_joint_accelerations: false
smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"

cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic: ~/delta_joint_cmds

command_out_type: trajectory_msgs/JointTrajectory

planning_frame: world
is_primary_planning_scene_monitor: false

incoming_command_timeout: 0.15
num_outgoing_halt_msgs_to_publish: 4

# Singularity thresholds — these are smallest-singular-value cutoffs of the Jacobian.
# LOWER values = more permissive (let the arm get closer to singularity before acting).
# Original values (35 / 70) were extremely conservative and caused premature stops
# even in the middle of the normal reachable workspace.
# New values give ~2x more usable workspace while still protecting the arm.
lower_singularity_threshold: 17.0     # was 35 — begin decelerating here
hard_stop_singularity_threshold: 30.0  # was 70 — emergency stop here
leaving_singularity_threshold_multiplier: 2.0

# Slightly larger usable workspace while still slowing before hard joint limits.
joint_limit_margin: 0.06

joint_topic: /joint_states
status_topic: ~/status
check_collisions: true
collision_check_rate: 20.0
self_collision_proximity_threshold: 0.01
scene_collision_proximity_threshold: 0.02
