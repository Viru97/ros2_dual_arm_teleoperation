# joint_limits.yaml — velocity and acceleration overrides for dual_ur5e
#
# Scaling factors raised from 0.1 → 0.5 so MoveIt plan-and-execute moves at
# half the hardware limit by default. Operators can still request lower scaling
# at call time. These only affect MoveIt-planned motions; Servo uses its own
# scale block in servo.yaml.
default_velocity_scaling_factor: 0.5
default_acceleration_scaling_factor: 0.4

# Per-joint limits (unchanged from URDF; kept here for explicit reference)
joint_limits:
  left_elbow_joint:
    has_velocity_limits: true
    max_velocity: 3.1415926535897931
    has_acceleration_limits: false
    max_acceleration: 0
